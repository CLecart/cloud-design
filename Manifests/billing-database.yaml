# billing-db: PostgreSQL 17 server holding the "billing_db" database of billing-app
# (its "orders" table stores the orders).
#
# StatefulSet (and not Deployment): the pod keeps a stable name (billing-db-0)
# and its own persistent volume. EBS volumes are zonal: the pod is always
# rescheduled in the Availability Zone of its volume.
# Reachable inside the cluster at billing-db:5432.

# Headless Service (clusterIP: None): the DNS name resolves straight to the pod
# IP. It is also the "governing" Service the StatefulSet requires.
apiVersion: v1
kind: Service
metadata:
  name: billing-db
  labels:
    app: billing-db
    app.kubernetes.io/part-of: cloud-design
spec:
  clusterIP: None
  selector:
    app: billing-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-db
  labels:
    app: billing-db
    app.kubernetes.io/part-of: cloud-design
spec:
  serviceName: billing-db
  replicas: 1
  selector:
    matchLabels:
      app: billing-db
  template:
    metadata:
      labels:
        app: billing-db
        app.kubernetes.io/part-of: cloud-design
    spec:
      # None of the containers calls the Kubernetes API.
      automountServiceAccountToken: false
      # The image runs as "postgres" (uid 70). The numeric ids let Kubernetes
      # enforce runAsNonRoot; fsGroup makes the new EBS volume (owned by root)
      # writable by the postgres group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: billing-db
          image: billing-database
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Data in a sub-directory: the root of an EBS volume holds lost+found,
            # and initdb refuses a directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: billing_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: billing-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-db-secret
                  key: password
            # Defaults of psql, so `kubectl exec -it billing-db-0 -- psql`
            # opens the database without any option.
            - name: PGUSER
              value: $(POSTGRES_USER)
            - name: PGDATABASE
              value: $(POSTGRES_DB)
          # The first start initialises the cluster before the server listens on
          # TCP: the startup probe gives it up to 150 s.
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Writable scratch space the read-only root filesystem lacks:
            # unix socket and lock file, temporary files.
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  # One claim per replica (data-billing-db-0): the EBS CSI driver creates an encrypted
  # gp3 volume (StorageClass of Manifests/storage.yaml) in the zone of the pod.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: billing-db
          app.kubernetes.io/part-of: cloud-design
      spec:
        storageClassName: gp3-encrypted
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
