# Persistent storage of the stateful services (inventory-db, billing-db, rabbitmq).
#
# Each volumeClaimTemplate asks for a volume of this class, and the EBS CSI
# driver (EKS add-on, terraform/platform/eks.tf) creates an encrypted gp3 EBS
# volume on demand. WaitForFirstConsumer creates the volume only once the pod
# is scheduled, in the same Availability Zone as its node (EBS volumes are zonal).
#
# reclaimPolicy Delete: deleting a claim deletes its volume, so Scripts/teardown.sh
# can remove every volume before `terraform destroy` (the cluster deletion alone
# would leave them behind, still billed).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
  labels:
    app.kubernetes.io/part-of: cloud-design
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  # Encrypted at rest with the AWS managed key of EBS (no extra cost).
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
