# Persistent storage of the stateful services.
#
# The volumes are directories exported over NFS by the master VM
# (192.168.56.110:/srv/nfs/k3s, see Scripts/k3s-master.sh). Because the data
# lives on the network and not on the disk of the node running the pod, a
# database pod can be rescheduled on any node and find its data again.
#
# The PersistentVolumes are created statically (no dynamic provisioner): each
# one carries an "app" label, and the volumeClaimTemplate of the matching
# StatefulSet selects it by that label.

# Class of the NFS volumes. "no-provisioner": Kubernetes only binds the claims
# to the PersistentVolumes declared below, it never creates volumes itself.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
  labels:
    app.kubernetes.io/part-of: orchestrator
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
# Data directory of the inventory PostgreSQL database (claimed by inventory-db-0).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: inventory-db-pv
  labels:
    app: inventory-db
    app.kubernetes.io/part-of: orchestrator
spec:
  storageClassName: nfs
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  # Retain: deleting the claim keeps the data on the NFS server.
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.56.110
    path: /srv/nfs/k3s/inventory-db
---
# Data directory of the billing PostgreSQL database (claimed by billing-db-0).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: billing-db-pv
  labels:
    app: billing-db
    app.kubernetes.io/part-of: orchestrator
spec:
  storageClassName: nfs
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.56.110
    path: /srv/nfs/k3s/billing-db
---
# RabbitMQ node data (durable queue and persistent messages, claimed by rabbitmq-0).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: orchestrator
spec:
  storageClassName: nfs
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.56.110
    path: /srv/nfs/k3s/rabbitmq
